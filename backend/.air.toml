root = "."
testdata_dir = "testdata"
# ビルド成果物はコンテナ内の /tmp/air に置く。
# 開発コンテナは root で動き ./backend を /app にバインドマウントしているため、
# リポジトリ配下（tmp/）に書くとホスト側に root 所有のファイルが残る。
tmp_dir = "/tmp/air"

[build]
  args_bin = []
  bin = "/tmp/air/main"
  cmd = "go build -o /tmp/air/main ./cmd/api"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
