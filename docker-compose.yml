services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=development

volumes:
  go-mod-cache:
