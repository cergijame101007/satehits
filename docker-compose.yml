services:
  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=development
    depends_on:
      - minio

  # ローカルの画像ストレージ（本番 Cloudflare R2 の S3 互換モック）
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # 管理コンソール
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data

  # 起動時にバケットを作成し、公開読み取りポリシーを設定する初期化コンテナ
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin) do echo 'waiting for minio...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/satehits-images;
      /usr/bin/mc anonymous set download local/satehits-images;
      echo 'minio bucket ready';
      exit 0;
      "

volumes:
  go-mod-cache:
  minio-data:
